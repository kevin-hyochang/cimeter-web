<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cimeter license key</title>
<script>
  /* Same contract as the landing page: empty means same origin. */
  window.CIMETER_API = "https://cimeter-api.onrender.com";
</script>
<style>
  :root {
    --bg: #fbfbfa; --surface: #ffffff; --line: #e4e4e2;
    --ink: #18181b; --ink-2: #52525b; --ink-3: #6b6b68; --accent: #0f766e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e11; --surface: #14161a; --line: #24272d;
      --ink: #f2f3f5; --ink-2: #a8adb6; --ink-3: #7c828c; --accent: #4db6a8;
    }
  }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6; display: grid; place-items: center; min-height: 100dvh; padding: 24px;
  }
  main { max-width: 620px; width: 100%; }
  h1 { font-size: 1.65rem; letter-spacing: -0.025em; margin: 0 0 12px; }
  p { margin: 0; color: var(--ink-2); }
  code {
    display: block; background: var(--surface); border: 1px dashed var(--accent);
    padding: 16px 18px; border-radius: 10px; word-break: break-all; margin: 20px 0 0;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px;
    color: var(--ink);
  }
  .note { color: var(--ink-3); font-size: 14px; margin-top: 16px; }
  a { color: var(--accent); }
  form { margin-top: 20px; display: grid; gap: 10px; }
  label { font-size: 14px; color: var(--ink-2); }
  input {
    font: inherit; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); letter-spacing: .02em;
  }
  button {
    font: inherit; font-weight: 560; height: 44px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Thank you. / 감사합니다.</h1>
  <p id="msg">Fetching your license key. / 라이선스 키를 가져오는 중입니다.</p>
  <div id="out"></div>
  <form id="gr" hidden autocomplete="off">
    <label for="gk">Paste the license key from your Gumroad receipt. / Gumroad 영수증의 라이선스 키를 붙여넣으세요.</label>
    <input id="gk" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" spellcheck="false" required>
    <button type="submit" id="gb">Get my cimeter key / cimeter 키 받기</button>
  </form>
  <p class="note" id="hint"></p>
</main>
<script>
const sid = new URLSearchParams(location.search).get("session_id");
const api = window.CIMETER_API || "";
const msg = document.getElementById("msg");
const out = document.getElementById("out");
const hint = document.getElementById("hint");
const SUPPORT = "https://github.com/kevin-hyochang/cimeter-web/issues";

/* 이 사람은 방금 돈을 냈다. 여기서 막히면 그게 이 제품에 대한 첫 경험이다.
   무슨 일이 있어도 다음에 무엇을 할지는 알려준다. */
function dead(text) {
  msg.textContent = text;
  hint.replaceChildren(
    document.createTextNode("Copy your key somewhere safe once it appears — this page closes " +
      "a day after the first claim. / 키가 나오면 안전한 곳에 복사해 두세요. 이 페이지는 첫 회수 " +
      "하루 뒤 닫힙니다. "),
  );
  const a = document.createElement("a");
  a.href = SUPPORT;
  a.textContent = "Tell us and we will send the key. / 알려주시면 키를 보내드립니다.";
  hint.appendChild(a);
}

/* Gumroad 로 산 사람은 영수증에 라이선스 키가 있다. 그걸 붙여넣으면 우리 키가
   나온다. 갱신도 같은 자리다 — 35일 뒤 같은 키를 다시 붙여넣으면 된다. */
const form = document.getElementById("gr");
const gk = document.getElementById("gk");
const gb = document.getElementById("gb");
function showKey(d) {
  msg.textContent = "Save this key now and set it as LICENSE_KEY. / 아래 키를 저장해 LICENSE_KEY로 설정하세요.";
  const el = document.createElement("code");
  el.textContent = d.licenseKey;          // textContent, so a key is never parsed as markup
  out.replaceChildren(el);
  hint.textContent = (d.expiresAt ? "Valid until " + d.expiresAt + " — paste the same Gumroad key here again to renew. / " +
    d.expiresAt + "까지 유효 — 갱신은 같은 Gumroad 키를 여기 다시 붙여넣으면 됩니다. " : "") +
    "cimeter spend --repo owner/name";
  form.hidden = true;
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  gb.disabled = true;
  msg.textContent = "Checking with Gumroad. / Gumroad 에 확인하는 중입니다.";
  fetch(api + "/api/health", { cache: "no-store" }).catch(() => null);   // 잠든 서버를 깨운다
  try {
    const r = await fetch(api + "/api/license/claim", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ gumroadKey: gk.value.trim() }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.licenseKey) { showKey(d); return; }
    msg.textContent = d.error || ("Could not verify that key (HTTP " + r.status + "). / 키를 확인하지 못했습니다.");
  } catch {
    msg.textContent = "Could not reach the server. Try again in a moment. / 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도하세요.";
  } finally {
    gb.disabled = false;
  }
});

if (!sid) {
  msg.textContent = "Bought cimeter on Gumroad? / Gumroad 에서 구매하셨나요?";
  form.hidden = false;
  gk.focus();
} else {
  /* 무료 호스팅은 잠들어 있다가 첫 요청에 최대 75초까지 걸린다. 랜딩은 이걸
     대비하는데 이 페이지는 안 했다 — 결제 직후 서버가 자고 있으면 20초 만에
     "찾을 수 없습니다. 지원팀에 문의하세요"가 떴다. 가장 나쁜 순간에 나오는
     가장 나쁜 문장이다. 먼저 깨우고, 깨어날 시간만큼 기다린다. */
  fetch(api + "/api/health", { cache: "no-store" }).catch(() => null);
  claim();
}

function withTimeout(url, ms) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  return fetch(url, { signal: ac.signal }).finally(() => clearTimeout(timer));
}

async function claim(attempt = 0) {
  /* 웹훅이 아직 도착하지 않았을 수도, 서버가 깨어나는 중일 수도 있다.
     둘 다 기다리면 되는 일이라 90초까지는 조용히 기다린다. */
  const MAX_ATTEMPTS = 30;
  try {
    const r = await withTimeout(
      api + "/api/license/claim?session_id=" + encodeURIComponent(sid), 75000);
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.licenseKey) { showKey(d); return; }
    if (attempt < MAX_ATTEMPTS) {
      if (attempt === 2) {
        msg.textContent = "Still waiting for the payment to settle. This can take a minute. / " +
                          "결제 확인을 기다리는 중입니다. 1분 정도 걸릴 수 있습니다.";
      }
      setTimeout(() => claim(attempt + 1), 3000);
      return;
    }
    dead(d.error || "We could not find that purchase yet. / 아직 그 결제를 찾지 못했습니다.");
  } catch {
    if (attempt < MAX_ATTEMPTS) { setTimeout(() => claim(attempt + 1), 3000); return; }
    dead("Could not reach the server. / 서버에 연결하지 못했습니다.");
  }
}
</script>
</body>
</html>
